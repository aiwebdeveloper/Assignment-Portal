<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Submission | Student Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <nav>
        <div class="logo">
            <i data-lucide="graduation-cap"></i>
            <span>EduPortal</span>
        </div>
        <div class="nav-links">
            <a href="auth.html" class="teacher-btn">Teacher Login</a>
        </div>
    </nav>

    <main>
        <div class="hero">
            <h1>Submit Your <span>Assignment</span></h1>
            <p>Upload your work and get assigned to your learning group.</p>
        </div>

        <section class="submission-container">
            <div class="glass-card submission-card">
                <form id="submissionForm">
                    <div class="input-group">
                        <label for="studentName"><i data-lucide="user"></i> Full Name</label>
                        <input type="text" id="studentName" placeholder="Enter your full name" required>
                    </div>

                    <div class="input-group">
                        <label for="whatsappNumber"><i data-lucide="phone"></i> WhatsApp Number</label>
                        <input type="tel" id="whatsappNumber" placeholder="Enter your WhatsApp number" required>
                    </div>

                    <div class="input-group">
                        <label for="assignmentLink"><i data-lucide="link"></i> Assignment Drive Link</label>
                        <input type="url" id="assignmentLink" placeholder="Paste your Google Drive link here" required>
                    </div>

                    <div class="input-group">
                        <label for="notes"><i data-lucide="message-square"></i> Additional Notes</label>
                        <textarea id="notes" placeholder="Any message for the teacher?"></textarea>
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">
                        Submit Assignment <i data-lucide="arrow-right"></i>
                    </button>
                </form>

                <div id="successMessage" class="success-message hidden">
                    <div class="icon-circle">
                        <i data-lucide="check-circle-2"></i>
                    </div>
                    <h2>Submission Successful!</h2>
                    <p>Your assignment has been received. Please wait for the teacher to check it.</p>
                    <button onclick="resetForm()" class="secondary-btn">Submit Another</button>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
